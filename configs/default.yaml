# Default configuration for the FWI attribution pipeline.
# Override specific keys with experiment-specific YAML files under configs/.

paths:
  # Discovered 2026-09-03: staged bundle under the repo itself. loaders.py reads
  # all of {StudyCoord_025_veg,StudyCoord_025_region,LandCover_keep_2021_corrected,
  # dem_025_veg.mat, AridityIndex_025_1979_2025_veg.mat, grid_*_weekly_veg*} from
  # this one directory -- see data/loaders.py docstring for the full mapping.
  raw_data_dir: /projects/hpcl-cli185/users/ktk/lstm_attn/code/01_Data/025_week_LULC
  sample_table_dir: data/processed  # intermediate arrays produced by loaders.py
  log_dir: logs
  results_dir: results

domain:
  states: [TX, OK, NM, AZ]
  resolution_deg: 0.25
  n_clusters: 5

splits:
  train: [2001, 2015]
  val: [2016, 2017]
  test: [2018, 2021]

standardization:
  mode: per_grid_cell   # "per_grid_cell" or "per_cluster"
  eps: 1.0e-6

branches:
  active: [A, B, C]     # subset of {A, B, C}; ablation script sweeps all 7 combinations

model:
  branch_a:
    hidden_size: 16
  branch_b:
    hidden_size: 64
    num_layers: 1
    attn_size: 64
    dropout: 0.1
    pooling: attention   # "attention" or "final_state" (plain-LSTM baseline)
  branch_c:
    hidden_size: 8
  head:
    hidden_sizes: [64, 32]
    dropout: 0.2

training:
  batch_size: 256
  epochs: 100
  learning_rate: 1.0e-3
  weight_decay: 0.0
  early_stopping_patience: 10
  seeds: [0, 1, 2, 3, 4]
  device: cuda   # falls back to cpu if unavailable

baselines:
  random_forest:
    n_estimators: 500
    max_depth: null
    n_jobs: -1
  climatology:
    week_definition: iso_week   # TODO: confirm against native FWI/weekly aggregation convention

evaluation:
  bootstrap:
    n_boot: 2000
    ci: 0.95
  nrmse_norm: std   # RMSE normalized by obs std within the aggregation group
